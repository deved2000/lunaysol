name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret - signing with a debug key."
          fi

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "LunaSolCal-${VERSION_NAME}.apk"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: LunaSolCal-*.apk
          generate_release_notes: true
